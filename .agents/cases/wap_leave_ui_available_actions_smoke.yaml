id: qingoa.leave.ui_available_actions_smoke
title: App WebView 请假关键按钮显隐 smoke
version: v1.72
business_line: workflow_wap
priority: P0
layers: [app, app_webview, wap, api, debug]
target:
  app: QingOA
  entry: app_home_workflow_webview
actors:
  applicant: konglingjia
  manager: manager
preconditions:
  - type: http_call
    id: reset_workflow
    method: POST
    url: /debug/workflow/reset?username=konglingjia
  - type: http_call
    id: submit_leave
    actor: applicant
    method: POST
    url: /api/leave/requests
    body:
      leave_type: annual
      start_date: "{{today}}"
      end_date: "{{today+1}}"
      reason: App WebView 验证 available_actions 关键按钮
    save:
      process_instance_id: $submit_leave.response.data.process_instance_id
steps:
  - id: reopen_workflow_as_applicant
    actor: applicant
    action: app_open_wap_entry
    entry: workflow
  - id: open_as_applicant
    actor: applicant
    action: wap_open
    url: /wap/#/workflow/detail/$submit_leave.process_instance_id
  - id: assert_applicant_cancel_visible
    actor: applicant
    action: ui_assert
    selector: "[data-testid='workflow-action-cancel']"
    operator: exists
  - id: assert_applicant_approve_hidden
    actor: applicant
    action: ui_assert
    selector: "[data-testid='workflow-action-approve']"
    operator: not_exists
  - id: open_as_manager_from_app
    actor: manager
    action: app_open_wap_entry
    entry: workflow
  - id: open_as_manager
    actor: manager
    action: wap_open
    url: /wap/#/workflow/detail/$submit_leave.process_instance_id
expected:
  - type: ui_assert
    actor: manager
    selector: "[data-testid='workflow-action-approve']"
    operator: exists
  - type: ui_assert
    actor: manager
    selector: "[data-testid='workflow-action-reject']"
    operator: exists
  - type: ui_assert
    actor: manager
    selector: "[data-testid='workflow-action-return']"
    operator: exists
artifacts: [device_screenshot, webview_screenshot, requests_json, report_md]
