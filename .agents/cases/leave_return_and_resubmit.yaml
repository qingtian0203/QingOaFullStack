id: qingoa.leave.return_and_resubmit
title: 请假退回修改后重新提交
version: v1.7
business_line: leave_workflow_api
priority: P0
layers: [api, debug]
actors:
  applicant: konglingjia
  manager: manager
preconditions:
  - type: http_call
    id: reset_workflow
    method: POST
    url: /debug/workflow/reset?username=konglingjia
  - type: login
    actor: applicant
    username: konglingjia
    password: "123456"
  - type: login
    actor: manager
    username: manager
    password: "123456"
steps:
  - id: submit_leave
    actor: applicant
    action: http_call
    method: POST
    url: /api/leave/requests
    body:
      leave_type: personal
      start_date: "{{today}}"
      end_date: "{{today+3}}"
      reason: 先提交四天事假
    save:
      process_instance_id: $submit_leave.response.data.process_instance_id
  - id: return_manager
    actor: manager
    action: return_task_for_instance
    params:
      instance_id: $submit_leave.process_instance_id
      note: 请缩短请假区间
  - id: resubmit_leave
    actor: applicant
    action: http_call
    method: POST
    url: /api/workflow/instances/$submit_leave.process_instance_id/resubmit
    body:
      leave_type: personal
      start_date: "{{today}}"
      end_date: "{{today+1}}"
      reason: 改为两天事假
  - id: approve_manager
    actor: manager
    action: approve_task_for_instance
    params:
      instance_id: $submit_leave.process_instance_id
      note: 修改后同意
expected:
  - type: assert
    source: $return_manager.response
    path: data.status
    operator: eq
    value: returned
  - type: assert
    source: $resubmit_leave.response
    path: data.days
    operator: eq
    value: 2
  - type: assert
    source: $approve_manager.response
    path: data.status
    operator: eq
    value: approved
  - type: http_call
    id: latest_leave
    method: GET
    url: /debug/leave/latest?username=konglingjia
  - type: assert
    source: $latest_leave.response
    path: data.leave.return_reason
    operator: eq
    value: null
notes:
  - 退回状态统一为 returned；WAP 通过 timeline node_key 区分退回节点。
artifacts: [report_md, debug_json]
