id: qingoa.attendance.clock_in_duplicate
title: 上班卡重复打卡拦截
version: v1.7
business_line: attendance
priority: P0
layers: [app, api, debug]
actors:
  employee: konglingjia
preconditions:
  - type: http_call
    id: freeze_time
    method: POST
    url: /debug/freeze-time
    body: {datetime: "2026-05-04 09:01:00"}
  - type: http_call
    id: reset_punch_date
    method: POST
    url: /debug/punch/reset-today
    body: {username: konglingjia, punch_date: "2026-05-04"}
steps:
  - id: first_clock_in
    actor: employee
    action: app_click
    target: qingoa_home_punch_entry
    wait_for: qingoa_punch_clock_in_button
  - id: input_location
    actor: employee
    action: app_fill
    fields:
      qingoa_punch_test_lat_input: "39.811774"
      qingoa_punch_test_lng_input: "116.295234"
  - id: first_clock_in_submit
    actor: employee
    action: app_click
    target: qingoa_punch_clock_in_button
    wait_for: qingoa_punch_clock_out_button
    wait_timeout: 8
  - id: second_clock_in
    actor: employee
    action: http_call
    method: POST
    url: /api/punch/clock
    expect_code: 1008
    body:
      lat: 39.811774
      lng: 116.295234
      device_id: android_device_001
      punch_type: clock_in
  - id: debug_state
    action: http_call
    method: GET
    url: /debug/state
  - id: latest
    action: http_call
    method: GET
    url: /debug/attendance/latest?username=konglingjia&punch_type=clock_in
expected:
  - type: request_log
    id: first_clock_request
    method: POST
    path: /api/punch/clock
    response_code: 0
  - type: assert
    source: $second_clock_in.response
    path: code
    operator: eq
    value: 1008
  - type: assert
    source: $debug_state.response
    path: data.today_punch_records
    operator: len_eq
    value: 1
  - type: assert
    source: $latest.response
    path: data.record.punch_type
    operator: eq
    value: clock_in
artifacts: [requests_json, debug_json, report_md]
