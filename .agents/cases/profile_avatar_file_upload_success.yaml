id: qingoa.profile_auth.avatar_file_upload_success
title: 真实头像文件上传并绑定用户资料
version: v1.71
business_line: profile_auth
priority: P0
layers: [api]
actors:
  employee: konglingjia
preconditions:
  - type: http_call
    id: reset_profile
    method: POST
    url: /debug/profile/reset
    body: {username: konglingjia}
  - type: login
    actor: employee
    username: konglingjia
    password: "123456"
steps:
  - id: upload_avatar
    actor: employee
    action: upload_file
    url: /api/files/upload
    fields:
      usage: avatar
    file:
      filename: avatar.png
      mime_type: image/png
      content_base64: iVBORw0KGgpxaW5nb2EtdjEtNzEtYXZhdGFy
  - id: bind_avatar
    actor: employee
    action: http_call
    method: POST
    url: /api/user/avatar
    body:
      file_id: $upload_avatar.response.data.file_id
  - id: profile
    actor: employee
    action: http_call
    method: GET
    url: /api/user/profile
expected:
  - type: assert
    source: $upload_avatar.response
    path: code
    operator: eq
    value: 0
  - type: assert
    source: $upload_avatar.response
    path: data.url
    operator: contains
    value: /static/uploads/avatar/
  - type: assert
    source: $bind_avatar.response
    path: data.avatar_url
    operator: eq
    value: $upload_avatar.response.data.url
  - type: assert
    source: $profile.response
    path: data.avatar_url
    operator: eq
    value: $upload_avatar.response.data.url
artifacts: [requests_json, report_md]
