id: qingoa.im_chat.image_send_display
title: IM 图片消息落库并在 App 展示
version: v1.8
business_line: im_chat
priority: P0
layers: [app, api, debug]
actors:
  employee: konglingjia
preconditions:
  - type: http_call
    id: reset_im
    method: POST
    url: /debug/im/reset
    body: {usernames: [konglingjia, manager]}
  - type: login
    actor: employee
    username: konglingjia
    password: "123456"
  - type: upload_file
    id: upload_image
    actor: employee
    url: /api/files/upload
    fields:
      usage: im_image
    file:
      filename: im-chat.png
      mime_type: image/png
      content_base64: iVBORw0KGgpxaW5nb2EtaW0tY2hhdA==
  - type: http_call
    id: conversation
    actor: employee
    method: POST
    url: /api/im/conversations/single
    body: {peer_user_id: 5}
  - type: http_call
    id: image_message
    actor: employee
    method: POST
    url: /api/im/conversations/$conversation.response.data.id/messages
    body:
      message_type: image
      file_id: $upload_image.response.data.file_id
steps:
  - id: open_chat_tab
    actor: employee
    action: app_click
    target: qingoa_bottom_tab_chat
    wait_for: qingoa_chat_conversation_$conversation.response.data.id
    wait_timeout: 8
  - id: open_conversation
    actor: employee
    action: app_click
    target: qingoa_chat_conversation_$conversation.response.data.id
    wait_for: qingoa_chat_image_message
    wait_timeout: 8
expected:
  - type: assert
    source: $image_message.response
    path: data.message_type
    operator: eq
    value: image
  - type: assert
    source: $image_message.response
    path: data.content
    operator: eq
    value: ""
  - type: assert
    source: $image_message.response
    path: data.file_id
    operator: eq
    value: $upload_image.response.data.file_id
  - type: ui_assert
    selector: qingoa_chat_image_button
    operator: exists
  - type: ui_assert
    selector: qingoa_chat_image_message
    operator: exists
artifacts: [screenshot, requests_json, debug_json, report_md]
