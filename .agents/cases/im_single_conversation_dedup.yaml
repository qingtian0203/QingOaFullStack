id: qingoa.im_chat.single_conversation_dedup
title: IM 单聊重复创建返回同一会话
version: v1.8
business_line: im_chat
priority: P0
layers: [api, debug]
actors:
  employee: konglingjia
  manager: manager
preconditions:
  - type: http_call
    id: reset_im
    method: POST
    url: /debug/im/reset
    body: {usernames: [konglingjia, manager]}
  - type: login
    actor: employee
    username: konglingjia
    password: "123456"
  - type: login
    actor: manager
    username: manager
    password: "123456"
steps:
  - id: create_ab
    actor: employee
    action: http_call
    method: POST
    url: /api/im/conversations/single
    body: {peer_user_id: 5}
  - id: create_ba
    actor: manager
    action: http_call
    method: POST
    url: /api/im/conversations/single
    body: {peer_user_id: 1}
expected:
  - type: assert
    source: $create_ab.response
    path: data.id
    operator: eq
    value: $create_ba.response.data.id
  - type: http_call
    id: state
    method: GET
    url: /debug/im/state?username=konglingjia
  - type: assert
    source: $state.response
    path: data.conversations
    operator: len_eq
    value: 1
artifacts: [requests_json, debug_json, report_md]
