id: qingoa.im_chat.friend_search_and_add
title: IM 搜索用户并添加好友
version: v1.8
business_line: im_chat
priority: P0
layers: [app, api, debug]
actors:
  employee: konglingjia
preconditions:
  - type: http_call
    id: reset_im
    method: POST
    url: /debug/im/reset
    body: {usernames: [konglingjia, manager]}
  - type: login
    actor: employee
    username: konglingjia
    password: "123456"
steps:
  - id: open_chat_tab
    actor: employee
    action: app_click
    target: qingoa_bottom_tab_chat
    wait_for: qingoa_chat_page
    wait_timeout: 8
  - id: open_create
    actor: employee
    action: app_click
    target: qingoa_chat_create_button
    wait_for: qingoa_chat_search_input
    wait_timeout: 8
  - id: search_manager
    actor: employee
    action: app_fill
    fields:
      qingoa_chat_search_input: manager
  - id: add_or_chat
    actor: employee
    action: app_click
    target: qingoa_chat_user_action_manager
    wait_for: qingoa_chat_detail_page
    wait_timeout: 8
expected:
  - type: http_call
    id: im_state
    method: GET
    url: /debug/im/state?username=konglingjia
  - type: assert
    source: $im_state.response
    path: data.friends.0.friend_user_id
    operator: eq
    value: 5
  - type: assert
    source: $im_state.response
    path: data.conversations
    operator: len_gte
    value: 1
artifacts: [screenshot, requests_json, debug_json, report_md]
