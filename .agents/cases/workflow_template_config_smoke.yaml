id: qingoa.workflow.template_config_smoke
title: 工作流模板配置与实例节点 smoke
version: v1.71
business_line: leave_workflow_api
priority: P2
layers: [api, debug]
actors:
  applicant: konglingjia
preconditions:
  - type: http_call
    id: reset_workflow
    method: POST
    url: /debug/workflow/reset?username=konglingjia
  - type: login
    actor: applicant
    username: konglingjia
    password: "123456"
steps:
  - id: api_templates
    actor: applicant
    action: http_call
    method: GET
    url: /api/workflow/templates
  - id: debug_templates
    action: http_call
    method: GET
    url: /debug/workflow/templates
  - id: submit_leave
    actor: applicant
    action: http_call
    method: POST
    url: /api/leave/requests
    body:
      leave_type: annual
      start_date: "{{today}}"
      end_date: "{{today+1}}"
      reason: 验证数据化流程模板与实例节点
  - id: debug_state
    action: http_call
    method: GET
    url: /debug/workflow/state?username=konglingjia
expected:
  - type: assert
    source: $api_templates.response
    path: data.templates
    operator: len_gte
    value: 2
  - type: assert
    source: $api_templates.response
    path: data.templates.1.nodes
    operator: len_gte
    value: 2
  - type: assert
    source: $debug_templates.response
    path: data.template_count
    operator: gte
    value: 2
  - type: assert
    source: $debug_state.response
    path: data.templates
    operator: len_gte
    value: 2
  - type: assert
    source: $debug_state.response
    path: data.instance_nodes
    operator: len_gte
    value: 1
  - type: assert
    source: $debug_state.response
    path: data.instance_nodes.0.node_title
    operator: exists
artifacts: [requests_json, debug_json, report_md]
