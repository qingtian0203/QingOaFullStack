id: qingoa.profile.ui_profile_card_avatar
title: App 我的页资料卡与头像展示
version: v1.72
business_line: profile_auth
priority: P1
layers: [app, api]
actors:
  employee: konglingjia
preconditions:
  - type: http_call
    id: reset_profile
    method: POST
    url: /debug/profile/reset
    body: {username: konglingjia}
  - type: login
    actor: employee
    username: konglingjia
    password: "123456"
  - type: http_call
    id: profile
    actor: employee
    method: GET
    url: /api/user/profile
steps:
  - id: open_mine_page
    actor: employee
    action: app_click
    target: qingoa_bottom_tab_mine
    wait_for: qingoa_mine_profile_card
    wait_timeout: 8
  - id: wait_avatar
    actor: employee
    action: app_wait
    target: qingoa_mine_avatar
expected:
  - type: assert
    source: $profile.response
    path: data.username
    operator: eq
    value: konglingjia
  - type: ui_assert
    selector: qingoa_mine_profile_card
    operator: exists
  - type: ui_assert
    selector: qingoa_mine_avatar
    operator: exists
artifacts: [screenshot, requests_json, report_md]
