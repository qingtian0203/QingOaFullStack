id: qingoa.workflow_wap.ui_app_entry_tabs
title: App 入口进入流程中心 WebView Tab smoke
version: v1.7
business_line: workflow_wap
priority: P0
layers: [app, app_webview, wap, api]
target:
  app_entry: qingoa_home_workflow_entry
actors:
  applicant: konglingjia
preconditions:
  - type: http_call
    id: reset_workflow
    method: POST
    url: /debug/workflow/reset?username=konglingjia
steps:
  - id: open_workflow_from_app
    actor: applicant
    username: konglingjia
    action: app_open_wap_entry
  - id: assert_in_app_webview
    actor: applicant
    action: webview_assert_current_url
    contains: /wap/
  - id: check_tabs_from_app_webview
    actor: applicant
    action: wap_assert_tabs
    selectors:
      new: "[data-testid='workflow-tab-new']"
      todo: "[data-testid='workflow-tab-todo']"
      urged: "[data-testid='workflow-tab-urged']"
      processing: "[data-testid='workflow-tab-processing']"
      returned: "[data-testid='workflow-tab-returned']"
      completed: "[data-testid='workflow-tab-completed']"
expected:
  - type: ui_assert
    actor: applicant
    selector: "[data-testid='workflow-tab-new']"
    operator: exists
  - type: ui_assert
    actor: applicant
    selector: "[data-testid='workflow-tab-processing']"
    operator: exists
artifacts: [device_screenshot, webview_screenshot, report_md]
