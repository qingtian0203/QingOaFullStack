id: qingoa.leave.attachment_invalid_file
title: 请假附件拒绝错误用途文件
version: v1.71
business_line: leave_workflow_api
priority: P0
layers: [api, debug]
actors:
  applicant: konglingjia
preconditions:
  - type: http_call
    id: reset_workflow
    method: POST
    url: /debug/workflow/reset?username=konglingjia
  - type: login
    actor: applicant
    username: konglingjia
    password: "123456"
steps:
  - id: upload_avatar_file
    actor: applicant
    action: upload_file
    url: /api/files/upload
    fields:
      usage: avatar
    file:
      filename: avatar.png
      mime_type: image/png
      content_base64: iVBORw0KGgp2MS03MS1hdHRhY2htZW50LW5lZ2F0aXZl
  - id: submit_leave_with_wrong_usage
    actor: applicant
    action: http_call
    method: POST
    url: /api/leave/requests
    expect_code: 2011
    body:
      leave_type: annual
      start_date: "{{today}}"
      end_date: "{{today+1}}"
      reason: 使用错误用途文件，应失败
      attachment_file_ids:
        - $upload_avatar_file.response.data.file_id
expected:
  - type: assert
    source: $upload_avatar_file.response
    path: code
    operator: eq
    value: 0
  - type: assert
    source: $submit_leave_with_wrong_usage.response
    path: code
    operator: eq
    value: 2011
  - type: assert
    source: $submit_leave_with_wrong_usage.response
    path: msg
    operator: contains
    value: 用途不匹配
  - type: http_call
    id: workflow_state
    method: GET
    url: /debug/workflow/state?username=konglingjia
  - type: assert
    source: $workflow_state.response
    path: data.leave_requests
    operator: len_eq
    value: 0
artifacts: [requests_json, debug_json, report_md]
