id: qingoa.leave.available_actions_matrix
title: 请假流程 available_actions 角色状态矩阵
version: v1.7
business_line: leave_workflow_api
priority: P0
layers: [api, debug]
actors:
  applicant: konglingjia
  manager: manager
preconditions:
  - type: http_call
    id: reset_workflow
    method: POST
    url: /debug/workflow/reset?username=konglingjia
steps:
  - id: submit_leave
    actor: applicant
    action: http_call
    method: POST
    url: /api/leave/requests
    body:
      leave_type: annual
      start_date: "{{today}}"
      end_date: "{{today+1}}"
      reason: 验证操作矩阵
    save:
      process_instance_id: $submit_leave.response.data.process_instance_id
  - id: applicant_detail
    actor: applicant
    action: http_call
    method: GET
    url: /api/workflow/instances/$submit_leave.process_instance_id
  - id: manager_detail
    actor: manager
    action: http_call
    method: GET
    url: /api/workflow/instances/$submit_leave.process_instance_id
  - id: return_manager
    actor: manager
    action: return_task_for_instance
    params:
      instance_id: $submit_leave.process_instance_id
      note: 请补充说明
  - id: applicant_returned_detail
    actor: applicant
    action: http_call
    method: GET
    url: /api/workflow/instances/$submit_leave.process_instance_id
expected:
  - type: assert
    source: $applicant_detail.response
    path: data.available_actions
    operator: contains
    value: cancel
  - type: assert
    source: $manager_detail.response
    path: data.available_actions
    operator: contains
    value: approve
  - type: assert
    source: $manager_detail.response
    path: data.available_actions
    operator: contains
    value: reject
  - type: assert
    source: $manager_detail.response
    path: data.available_actions
    operator: contains
    value: return
  - type: assert
    source: $applicant_returned_detail.response
    path: data.available_actions
    operator: contains
    value: resubmit
artifacts: [requests_json, debug_json, report_md]
