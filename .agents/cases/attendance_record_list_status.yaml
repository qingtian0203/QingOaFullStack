id: qingoa.attendance.record_list_status
title: 打卡记录列表日期、类型与状态展示
version: v1.7
business_line: attendance
priority: P0
layers: [app, api, debug]
actors:
  employee: konglingjia
preconditions:
  - type: http_call
    id: reset_punch_date
    method: POST
    url: /debug/punch/reset-today
    body: {username: konglingjia, punch_date: "2026-05-04"}
  - type: http_call
    id: freeze_late
    method: POST
    url: /debug/freeze-time
    body: {datetime: "2026-05-04 09:20:00"}
  - type: http_call
    id: clock_in_late
    actor: employee
    method: POST
    url: /api/punch/clock
    body:
      lat: 39.811774
      lng: 116.295234
      device_id: android_device_001
      punch_type: clock_in
steps:
  - id: open_punch_page
    actor: employee
    action: app_click
    target: qingoa_home_punch_entry
    wait_for: qingoa_punch_record_entry
  - id: open_punch_records
    actor: employee
    action: app_click
    target: qingoa_punch_record_entry
    wait_for: qingoa_punch_record_list
  - id: wait_record_list
    actor: employee
    action: app_wait
    target: qingoa_punch_record_list
  - id: records_api
    actor: employee
    action: http_call
    method: GET
    url: /api/punch/records?page=1&size=10
expected:
  - type: assert
    source: $records_api.response
    path: data.list.0.punch_type
    operator: eq
    value: clock_in
  - type: assert
    source: $records_api.response
    path: data.list.0.status
    operator: eq
    value: late
  - type: ui_assert
    selector: qingoa_punch_record_item_2026-05-04_missing_clock_out
    operator: exists
artifacts: [screenshot, requests_json, report_md]
