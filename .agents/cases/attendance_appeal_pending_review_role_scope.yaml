id: qingoa.attendance.appeal_pending_review_role_scope
title: 补卡待审批列表与角色权限边界
version: v1.7
business_line: attendance
priority: P0
layers: [api, debug]
actors:
  employee: konglingjia
  manager: manager
  hr: hr
  other: faraday
preconditions:
  - type: http_call
    id: reset_workflow
    method: POST
    url: /debug/workflow/reset?username=konglingjia
  - type: http_call
    id: reset_makeup_punch_date
    method: POST
    url: /debug/punch/reset-today
    body: {username: konglingjia, punch_date: "2026-06-04"}
steps:
  - id: submit_appeal
    actor: employee
    action: http_call
    method: POST
    url: /api/punch/appeal
    body:
      punch_date: "2026-06-04"
      punch_type: clock_out
      reason: forgot_clock_out
      expect_time: "18:10:00"
    save:
      appeal_id: $submit_appeal.response.data.appeal_id
  - id: manager_pending
    actor: manager
    action: http_call
    method: GET
    url: /api/punch/appeals/pending-review
  - id: unrelated_user_review
    actor: other
    action: http_call
    method: POST
    url: /api/punch/appeals/$submit_appeal.appeal_id/review
    expect_code: 1012
    body:
      action: approve
      note: 无关人员尝试审批
  - id: hr_review_before_manager
    actor: hr
    action: http_call
    method: POST
    url: /api/punch/appeals/$submit_appeal.appeal_id/review
    expect_code: 1012
    body:
      action: approve
      note: HR 不能跳过上级审批
  - id: manager_approve
    actor: manager
    action: http_call
    method: POST
    url: /api/punch/appeals/$submit_appeal.appeal_id/review
    body:
      action: approve
      note: 已核实
  - id: hr_pending
    actor: hr
    action: http_call
    method: GET
    url: /api/punch/appeals/pending-review
expected:
  - type: assert
    source: $manager_pending.response
    path: data.list.0.id
    operator: eq
    value: $submit_appeal.appeal_id
  - type: assert
    source: $manager_pending.response
    path: data.list.0.node_key
    operator: eq
    value: manager_review
  - type: assert
    source: $unrelated_user_review.response
    path: code
    operator: eq
    value: 1012
  - type: assert
    source: $hr_review_before_manager.response
    path: code
    operator: eq
    value: 1012
  - type: assert
    source: $manager_approve.response
    path: data.status
    operator: eq
    value: manager_approved
  - type: assert
    source: $hr_pending.response
    path: data.list.0.id
    operator: eq
    value: $submit_appeal.appeal_id
  - type: assert
    source: $hr_pending.response
    path: data.list.0.node_key
    operator: eq
    value: hr_review
artifacts: [requests_json, debug_json, report_md]
