id: qingoa.attendance.appeal_submit_and_approve
title: 补卡申诉提交并通过后生成 makeup 记录
version: v1.7
business_line: attendance
priority: P0
layers: [app, api, debug]
actors:
  employee: konglingjia
  manager: manager
  hr: hr
preconditions:
  - type: http_call
    id: reset_workflow
    method: POST
    url: /debug/workflow/reset?username=konglingjia
  - type: http_call
    id: reset_makeup_punch_date
    method: POST
    url: /debug/punch/reset-today
    body: {username: konglingjia, punch_date: "2026-04-30"}
  - type: login
    actor: employee
    username: konglingjia
    password: "123456"
  - type: login
    actor: manager
    username: manager
    password: "123456"
  - type: login
    actor: hr
    username: hr
    password: "123456"
steps:
  - id: open_mine_tab
    actor: employee
    action: app_click
    target: qingoa_bottom_tab_mine
    wait_for: qingoa_mine_punch_appeal_entry
  - id: open_appeal_page
    actor: employee
    action: app_click
    target: qingoa_mine_punch_appeal_entry
    wait_for: qingoa_punch_appeal_date_input
  - id: fill_appeal_form
    actor: employee
    action: app_fill
    fields:
      qingoa_punch_appeal_date_input: "2026-04-30"
      qingoa_punch_appeal_expect_time_input: "08:58:00"
      qingoa_punch_appeal_reason_input: "vehicle_issue"
  - id: submit_appeal_form
    actor: employee
    action: app_click
    target: qingoa_punch_appeal_submit_button
  - id: wait_appeal_submit
    actor: employee
    action: app_wait
    seconds: 1.5
  - id: manager_pending
    actor: manager
    action: http_call
    method: GET
    url: /api/punch/appeals/pending-review
    save:
      appeal_id: $manager_pending.response.data.list.0.id
  - id: manager_approve
    actor: manager
    action: http_call
    method: POST
    url: /api/punch/appeals/$manager_pending.appeal_id/review
    body:
      action: approve
      note: 已核实
  - id: hr_approve
    actor: hr
    action: http_call
    method: POST
    url: /api/punch/appeals/$manager_pending.appeal_id/review
    body:
      action: approve
      note: 同意补卡
  - id: approved_makeup_record
    actor: employee
    action: http_call
    method: GET
    url: /debug/attendance/latest?username=konglingjia&punch_type=clock_in&punch_date=2026-04-30
expected:
  - type: assert
    source: $manager_pending.response
    path: data.list.0.status
    operator: eq
    value: submitted
  - type: assert
    source: $manager_pending.response
    path: data.list.0.node_key
    operator: eq
    value: manager_review
  - type: assert
    source: $manager_approve.response
    path: data.status
    operator: eq
    value: manager_approved
  - type: assert
    source: $hr_approve.response
    path: data.status
    operator: eq
    value: approved
  - type: assert
    source: $approved_makeup_record.response
    path: data.record.status
    operator: eq
    value: makeup
  - type: assert
    source: $approved_makeup_record.response
    path: data.record.source
    operator: eq
    value: appeal
artifacts: [requests_json, debug_json, report_md]
