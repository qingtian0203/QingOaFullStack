id: qingoa.attendance.clock_out_requires_clock_in
title: 无上班卡时下班打卡失败
version: v1.7
business_line: attendance
priority: P0
layers: [api, debug]
actors:
  employee: konglingjia
preconditions:
  - type: http_call
    id: freeze_evening
    method: POST
    url: /debug/freeze-time
    body: {datetime: "2026-05-05 18:02:00"}
  - type: http_call
    id: reset_punch_date
    method: POST
    url: /debug/punch/reset-today
    body: {username: konglingjia, punch_date: "2026-05-05"}
steps:
  - id: clock_out_without_clock_in
    actor: employee
    action: http_call
    method: POST
    url: /api/punch/clock
    expect_code: 1007
    body:
      lat: 39.811774
      lng: 116.295234
      device_id: android_device_001
      punch_type: clock_out
  - id: latest_clock_out
    actor: employee
    action: http_call
    method: GET
    url: /debug/attendance/latest?username=konglingjia&punch_type=clock_out&punch_date=2026-05-05
expected:
  - type: assert
    source: $clock_out_without_clock_in.response
    path: code
    operator: eq
    value: 1007
  - type: assert
    source: $clock_out_without_clock_in.response
    path: msg
    operator: contains
    value: 上班
  - type: assert
    source: $latest_clock_out.response
    path: data.record
    operator: eq
    value: null
artifacts: [requests_json, debug_json, report_md]
