id: qingoa.wap.workflow_tabs_empty_and_list
title: WAP 流程中心六个 Tab 空态与列表态
version: v1.7
business_line: workflow_wap
priority: P0
layers: [wap, api]
target:
  entry: /wap/#/workflow
actors:
  applicant: konglingjia
preconditions:
  - type: http_call
    id: reset_workflow
    method: POST
    url: /debug/workflow/reset?username=konglingjia
steps:
  - id: open_workflow
    actor: applicant
    action: wap_open
    url: /wap/#/workflow
  - id: check_tabs_empty
    actor: applicant
    action: wap_assert_tabs
    selectors:
      new: "[data-testid='workflow-tab-new']"
      todo: "[data-testid='workflow-tab-todo']"
      urged: "[data-testid='workflow-tab-urged']"
      processing: "[data-testid='workflow-tab-processing']"
      returned: "[data-testid='workflow-tab-returned']"
      completed: "[data-testid='workflow-tab-completed']"
  - id: seed_leave
    actor: applicant
    action: http_call
    method: POST
    url: /api/leave/requests
    body:
      leave_type: annual
      start_date: "{{today}}"
      end_date: "{{today+1}}"
      reason: 用于列表态验证
  - id: refresh_running
    actor: applicant
    action: wap_click
    selector: "[data-testid='workflow-tab-processing']"
expected:
  - type: ui_assert
    selector: "[data-testid='workflow-tab-new']"
    operator: exists
  - type: ui_assert
    selector: "[data-testid='workflow-tab-processing']"
    operator: exists
  - type: ui_assert
    selector: "[data-testid^='workflow-instance-']"
    operator: exists
artifacts: [screenshot, report_md]
