id: qingoa.leave.2_days_manager_approve
title: 请假 2 天直属上级审批通过
version: v1.7
business_line: leave_workflow_api
priority: P0
layers: [api, debug]
actors:
  applicant: konglingjia
  manager: manager
preconditions:
  - type: http_call
    id: reset_workflow
    method: POST
    url: /debug/workflow/reset?username=konglingjia
  - type: login
    actor: applicant
    username: konglingjia
    password: "123456"
  - type: login
    actor: manager
    username: manager
    password: "123456"
steps:
  - id: submit_leave
    actor: applicant
    action: http_call
    method: POST
    url: /api/leave/requests
    body:
      leave_type: annual
      start_date: "{{today}}"
      end_date: "{{today+1}}"
      reason: 家中有事，申请两天年假
    save:
      process_instance_id: $submit_leave.response.data.process_instance_id
  - id: manager_tasks
    actor: manager
    action: http_call
    method: GET
    url: /api/workflow/tasks?bucket=todo
  - id: approve_manager
    actor: manager
    action: approve_task_for_instance
    params:
      instance_id: $submit_leave.process_instance_id
      note: 直属上级同意
expected:
  - type: assert
    source: $submit_leave.response
    path: data.days
    operator: eq
    value: 2
  - type: assert
    source: $approve_manager.response
    path: data.status
    operator: eq
    value: approved
  - type: http_call
    id: latest_leave
    method: GET
    url: /debug/leave/latest?username=konglingjia
  - type: assert
    source: $latest_leave.response
    path: data.leave.status
    operator: eq
    value: approved
  - type: assert
    source: $latest_leave.response
    path: data.leave.process_instance_id
    operator: eq
    value: $submit_leave.process_instance_id
artifacts: [report_md, debug_json]
