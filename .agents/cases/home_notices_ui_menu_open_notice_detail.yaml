id: qingoa.home_notices.ui_menu_open_notice_detail
title: App 首页公告列表进入详情
version: v1.72
business_line: home_notices
priority: P1
layers: [app, api]
actors:
  employee: konglingjia
preconditions:
  - type: http_call
    id: reset_notice_reads
    method: POST
    url: /debug/notices/reset-read
    body: {username: konglingjia}
  - type: login
    actor: employee
    username: konglingjia
    password: "123456"
  - type: http_call
    id: notices
    actor: employee
    method: GET
    url: /api/home/notices?page=1&size=10
steps:
  - id: open_home
    actor: employee
    action: app_click
    target: qingoa_bottom_tab_home
    wait_for: qingoa_home_notice_list
    wait_timeout: 8
  - id: open_notice_detail
    actor: employee
    action: app_click
    target: qingoa_notice_item_$notices.response.data.list.0.id
    wait_for: qingoa_notice_detail_content
    wait_timeout: 8
expected:
  - type: assert
    source: $notices.response
    path: data.list
    operator: len_gte
    value: 1
  - type: ui_assert
    selector: qingoa_notice_detail_title
    operator: exists
  - type: ui_assert
    selector: qingoa_notice_detail_content
    operator: exists
artifacts: [screenshot, requests_json, report_md]
