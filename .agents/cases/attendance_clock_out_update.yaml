id: qingoa.attendance.clock_out_update
title: 下班卡二次打卡更新
version: v1.7
business_line: attendance
priority: P0
layers: [app, api, debug]
actors:
  employee: konglingjia
preconditions:
  - type: http_call
    id: freeze_morning
    method: POST
    url: /debug/freeze-time
    body: {datetime: "2026-05-04 09:01:00"}
  - type: http_call
    id: reset_punch_date
    method: POST
    url: /debug/punch/reset-today
    body: {username: konglingjia, punch_date: "2026-05-04"}
  - type: http_call
    id: seed_clock_in
    actor: employee
    method: POST
    url: /api/punch/clock
    body:
      lat: 39.811774
      lng: 116.295234
      device_id: android_device_001
      punch_type: clock_in
  - type: http_call
    id: freeze_evening_first
    method: POST
    url: /debug/freeze-time
    body: {datetime: "2026-05-04 18:01:00"}
  - type: http_call
    id: seed_first_clock_out
    actor: employee
    method: POST
    url: /api/punch/clock
    body:
      lat: 39.811774
      lng: 116.295234
      device_id: android_device_001
      punch_type: clock_out
  - type: http_call
    id: freeze_evening_second
    method: POST
    url: /debug/freeze-time
    body: {datetime: "2026-05-04 18:20:00"}
steps:
  - id: open_punch_page
    actor: employee
    action: app_click
    target: qingoa_home_punch_entry
    wait_for: qingoa_punch_clock_out_update_button
    wait_timeout: 8
  - id: input_location
    actor: employee
    action: app_fill
    fields:
      qingoa_punch_test_lat_input: "39.811774"
      qingoa_punch_test_lng_input: "116.295234"
  - id: update_clock_out
    actor: employee
    action: app_click
    target: qingoa_punch_clock_out_update_button
    wait_after: 1.2
  - id: latest
    action: http_call
    method: GET
    url: /debug/attendance/latest?username=konglingjia&punch_type=clock_out
expected:
  - type: assert
    source: $latest.response
    path: data.record.punch_type
    operator: eq
    value: clock_out
  - type: assert
    source: $latest.response
    path: data.record.punch_time
    operator: contains
    value: "18:20:00"
  - type: request_log
    id: clock_request
    method: POST
    path: /api/punch/clock
    response_code: 0
artifacts: [requests_json, debug_json, report_md]
