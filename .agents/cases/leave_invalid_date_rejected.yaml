id: qingoa.leave.invalid_date_rejected
title: 请假非法日期拒绝提交
version: v1.7
business_line: leave_workflow_api
priority: P0
layers: [api, debug]
actors:
  applicant: konglingjia
preconditions:
  - type: http_call
    id: reset_workflow
    method: POST
    url: /debug/workflow/reset?username=konglingjia
steps:
  - id: submit_invalid_date_leave
    actor: applicant
    action: http_call
    method: POST
    url: /api/leave/requests
    expect_code: 1021
    body:
      leave_type: annual
      start_date: "2026-06-05"
      end_date: "2026-06-04"
      reason: 结束日期早于开始日期
  - id: latest_leave
    actor: applicant
    action: http_call
    method: GET
    url: /debug/leave/latest?username=konglingjia
expected:
  - type: assert
    source: $submit_invalid_date_leave.response
    path: code
    operator: eq
    value: 1021
  - type: assert
    source: $submit_invalid_date_leave.response
    path: msg
    operator: contains
    value: 结束日期
  - type: assert
    source: $latest_leave.response
    path: data.leave
    operator: eq
    value: null
artifacts: [requests_json, debug_json, report_md]
