id: qingoa.im_chat.text_send_receive
title: IM App 发送文字并更新摘要
version: v1.8
business_line: im_chat
priority: P0
layers: [app, api, debug]
actors:
  employee: konglingjia
preconditions:
  - type: http_call
    id: reset_im
    method: POST
    url: /debug/im/reset
    body: {usernames: [konglingjia, manager]}
  - type: login
    actor: employee
    username: konglingjia
    password: "123456"
  - type: http_call
    id: conversation
    actor: employee
    method: POST
    url: /api/im/conversations/single
    body: {peer_user_id: 5}
steps:
  - id: open_chat_tab
    actor: employee
    action: app_click
    target: qingoa_bottom_tab_chat
    wait_for: qingoa_chat_conversation_$conversation.response.data.id
    wait_timeout: 8
  - id: open_conversation
    actor: employee
    action: app_click
    target: qingoa_chat_conversation_$conversation.response.data.id
    wait_for: qingoa_chat_message_input
    wait_timeout: 8
  - id: input_text
    actor: employee
    action: app_fill
    fields:
      qingoa_chat_message_input: meeting_3pm
  - id: send_text
    actor: employee
    action: app_click
    target: qingoa_chat_send_button
    wait_for: qingoa_chat_message_list
    wait_timeout: 8
expected:
  - type: http_call
    id: im_state
    method: GET
    url: /debug/im/state?username=konglingjia
  - type: assert
    source: $im_state.response
    path: data.messages.0.message_type
    operator: eq
    value: text
  - type: assert
    source: $im_state.response
    path: data.messages.0.content
    operator: eq
    value: meeting_3pm
  - type: request_log
    method: POST
    path: /api/im/conversations/$conversation.response.data.id/messages
    response_code: 0
artifacts: [screenshot_before, screenshot_after, requests_json, debug_json, report_md]
