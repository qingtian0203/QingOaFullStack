id: qingoa.leave.attachment_submit_and_approve
title: 请假附件提交并审批可见
version: v1.71
business_line: leave_workflow_api
priority: P0
layers: [api, debug]
actors:
  applicant: konglingjia
  manager: manager
preconditions:
  - type: http_call
    id: reset_workflow
    method: POST
    url: /debug/workflow/reset?username=konglingjia
  - type: login
    actor: applicant
    username: konglingjia
    password: "123456"
  - type: login
    actor: manager
    username: manager
    password: "123456"
steps:
  - id: upload_attachment
    actor: applicant
    action: upload_file
    url: /api/files/upload
    fields:
      usage: leave_attachment
    file:
      filename: leave-note.txt
      mime_type: text/plain
      content_text: QingOA v1.71 leave attachment evidence
  - id: submit_leave
    actor: applicant
    action: http_call
    method: POST
    url: /api/leave/requests
    body:
      leave_type: sick
      start_date: "{{today}}"
      end_date: "{{today+1}}"
      reason: 病假两天，附件说明
      attachment_file_ids:
        - $upload_attachment.response.data.file_id
    save:
      process_instance_id: $submit_leave.response.data.process_instance_id
  - id: manager_detail
    actor: manager
    action: http_call
    method: GET
    url: /api/workflow/instances/$submit_leave.process_instance_id
  - id: approve_manager
    actor: manager
    action: approve_task_for_instance
    params:
      instance_id: $submit_leave.process_instance_id
      note: 附件齐全，同意
expected:
  - type: assert
    source: $upload_attachment.response
    path: code
    operator: eq
    value: 0
  - type: assert
    source: $submit_leave.response
    path: data.attachments.0.file_id
    operator: eq
    value: $upload_attachment.response.data.file_id
  - type: assert
    source: $manager_detail.response
    path: data.business.attachments.0.file_id
    operator: eq
    value: $upload_attachment.response.data.file_id
  - type: assert
    source: $approve_manager.response
    path: data.status
    operator: eq
    value: approved
  - type: http_call
    id: latest_leave
    method: GET
    url: /debug/leave/latest?username=konglingjia
  - type: assert
    source: $latest_leave.response
    path: data.leave.attachments.0.filename
    operator: eq
    value: leave-note.txt
artifacts: [requests_json, debug_json, report_md]
