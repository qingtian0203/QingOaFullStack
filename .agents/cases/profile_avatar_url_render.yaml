id: qingoa.profile_auth.avatar_url_render
title: 用户头像 URL 写入与圆形展示
version: v1.7
business_line: profile_auth
priority: P1
layers: [api, app]
actors:
  employee: konglingjia
preconditions:
  - type: http_call
    id: reset_profile
    method: POST
    url: /debug/profile/reset
    body: {username: konglingjia}
  - type: login
    actor: employee
    username: konglingjia
    password: "123456"
  - type: http_call
    id: update_avatar
    actor: employee
    method: POST
    url: /api/user/avatar
    body:
      avatar_url: http://127.0.0.1:8010/static/avatars/qingoa_icon.png
  - type: http_call
    id: profile
    actor: employee
    method: GET
    url: /api/user/profile
steps:
  - id: open_mine_page
    actor: employee
    action: app_click
    target: qingoa_bottom_tab_mine
    wait_for: qingoa_mine_profile_card
    wait_timeout: 8
expected:
  - type: assert
    source: $update_avatar.response
    path: data.avatar_url
    operator: eq
    value: http://127.0.0.1:8010/static/avatars/qingoa_icon.png
  - type: assert
    source: $profile.response
    path: data.avatar_url
    operator: eq
    value: http://127.0.0.1:8010/static/avatars/qingoa_icon.png
  - type: ui_assert
    selector: qingoa_mine_profile_card
    operator: exists
artifacts: [screenshot, requests_json, report_md]
