id: qingoa.leave.4_days_manager_hr_approve
title: 请假 4 天触发 HR 二审
version: v1.7
business_line: leave_workflow_api
priority: P0
layers: [api, debug]
actors:
  applicant: konglingjia
  manager: manager
  hr: hr
preconditions:
  - type: http_call
    id: reset_workflow
    method: POST
    url: /debug/workflow/reset?username=konglingjia
  - type: login
    actor: applicant
    username: konglingjia
    password: "123456"
  - type: login
    actor: manager
    username: manager
    password: "123456"
  - type: login
    actor: hr
    username: hr
    password: "123456"
steps:
  - id: submit_leave
    actor: applicant
    action: http_call
    method: POST
    url: /api/leave/requests
    body:
      leave_type: sick
      start_date: "{{today}}"
      end_date: "{{today+3}}"
      reason: 病假四天，需要 HR 二审
    save:
      process_instance_id: $submit_leave.response.data.process_instance_id
  - id: approve_manager
    actor: manager
    action: approve_task_for_instance
    params:
      instance_id: $submit_leave.process_instance_id
      note: 直属上级同意
  - id: hr_tasks
    actor: hr
    action: http_call
    method: GET
    url: /api/workflow/tasks?bucket=todo
  - id: approve_hr
    actor: hr
    action: approve_task_for_instance
    params:
      instance_id: $submit_leave.process_instance_id
      note: HR 同意
expected:
  - type: assert
    source: $submit_leave.response
    path: data.days
    operator: eq
    value: 4
  - type: assert
    source: $approve_manager.response
    path: data.status
    operator: eq
    value: manager_approved
  - type: assert
    source: $hr_tasks.response
    path: data.tasks.0.node_key
    operator: eq
    value: hr_review
  - type: assert
    source: $approve_hr.response
    path: data.status
    operator: eq
    value: approved
  - type: http_call
    id: latest_leave
    method: GET
    url: /debug/leave/latest?username=konglingjia
  - type: assert
    source: $latest_leave.response
    path: data.leave.status
    operator: eq
    value: approved
artifacts: [report_md, debug_json]
