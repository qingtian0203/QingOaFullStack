id: qingoa.okr.list_detail
title: OKR 列表和详情
version: v1.7
business_line: okr
priority: P2
layers: [api, app]
actors:
  employee: konglingjia
preconditions:
  - type: http_call
    id: reset_okrs
    method: POST
    url: /debug/okr/reset
    body: {usernames: [konglingjia]}
  - type: login
    actor: employee
    username: konglingjia
    password: "123456"
  - type: http_call
    id: okr_list
    actor: employee
    method: GET
    url: /api/okr/list
  - type: http_call
    id: okr_detail
    actor: employee
    method: GET
    url: /api/okr/$okr_list.response.data.list.0.id
steps:
  - id: open_okr_tab
    actor: employee
    action: app_click
    target: qingoa_bottom_tab_okr
    wait_for: qingoa_okr_list
    wait_timeout: 8
  - id: open_okr_detail
    actor: employee
    action: app_click
    target: qingoa_okr_item_$okr_list.response.data.list.0.id
    wait_for: qingoa_okr_detail_content
    wait_timeout: 8
expected:
  - type: assert
    source: $okr_list.response
    path: data.list
    operator: len_gte
    value: 1
  - type: assert
    source: $okr_detail.response
    path: data.key_results
    operator: len_gte
    value: 1
  - type: ui_assert
    selector: qingoa_okr_detail_content
    operator: exists
artifacts: [requests_json, report_md]
